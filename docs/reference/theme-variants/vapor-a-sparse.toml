# VARIANT A - sparse and fast. Fewest depth lines, so each ridge is unmistakable.
# Peak displacement is 2.7x the line spacing here, versus 4.7x on the original.
schema = 1
id     = "vapor-a-sparse"
name   = "A: sparse + fast"
family = "vapor"

[colour]
lit         = "#ff53c8"
hot         = "#eafcff"
panel       = "#0a0416"
panel_alpha = 1.0
edge        = "#ff5f93"
edge_alpha  = 0.18

[look]
bloom = 3.0

[vaporwave]
lines  = 7
scroll = 3.4
amp    = 1.30
