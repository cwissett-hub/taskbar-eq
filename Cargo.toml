[package]
name = "taskbar-eq"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
rustfft = "6.4.1"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[dependencies.windows]
version = "0.62.2"
features = [
  # WinRT. Transitively enables Media + Foundation, which is what brings in the
  # `IAsyncOperation::join()` used to await the media calls without an async runtime.
  "Media_Control",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  # Toolhelp, for counting THIS process's threads during the leak hunt. Threads are the number
  # that actually stalled a game (19,000 of them); handles are only the cheap proxy the watchdog
  # polls. See win::health.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Media_Audio",
  "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = 3
lto = true
strip = true
